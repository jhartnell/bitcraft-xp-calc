services:
  bitcraft-xp-calc:
    image: ghcr.io/jhartnell/bitcraft-xp-calc:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitcraft-xp-calc
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
