# Rate limit zone for upstream BitJita API proxy (10 req/s per client IP)
limit_req_zone $binary_remote_addr zone=bitjita_api:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Default security headers for responses without location-specific add_header
  include /etc/nginx/snippets/security-headers.conf;

  # Gzip compression for static assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/xml application/javascript application/json image/svg+xml;

  # SPA Routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Read-only Reverse Proxy for BitJita API to bypass CORS
  location /api/ {
    limit_except GET HEAD {
      deny all;
    }

    limit_req zone=bitjita_api burst=25 nodelay;
    limit_req_status 429;

    proxy_pass https://bitjita.com/api/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 2;
    proxy_set_header Host bitjita.com;
    proxy_set_header User-Agent "Bitcraft-XP-Calculator-Proxy/1.10.1";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
  }

  # Ensure version manifest is never cached by browser or proxies
  location = /version.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;
  }

  # Immutable cache for Vite content-hashed assets
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Moderate cache for unhashed static files (favicon, icons, etc.)
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }
}
